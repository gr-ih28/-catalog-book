<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>カタログ帳</title>

<!-- アイコン / ホーム画面追加(PWA)対応 -->
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#35524A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カタログ帳">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEAE3;
    --surface:#FFFFFF;
    --surface-alt:#F5F3EE;
    --ink:#262421;
    --ink-soft:#6B6459;
    --ink-faint:#9C9488;
    --line:#D7D2C7;
    --line-strong:#BEB6A6;
    --pine:#35524A;
    --pine-dark:#233833;
    --pine-tint:#E4EBE8;
    --brass:#A9824F;
    --brass-tint:#F1E6D3;
    --danger:#A5432E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 30px;
    background:var(--pine);
    color:#fff;
    flex-shrink:0;
  }
  .header .brand .mark{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:25px;
    letter-spacing:0.02em;
  }
  .header .brand .sub{
    font-size:12.5px;
    color:#C9D6D2;
    letter-spacing:0.02em;
    margin-top:2px;
  }
  .btn-add{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--brass);
    color:#FFFFFF;
    border:none;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:17px;
    padding:16px 26px;
    border-radius:9px;
    cursor:pointer;
    transition:filter 0.15s ease;
    min-height:54px;
  }
  .btn-add:hover{ filter:brightness(1.06); }
  .btn-add:active{ filter:brightness(0.94); }
  .btn-add:disabled{ opacity:0.45; cursor:not-allowed; filter:none; }

  .header-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .btn-reorder{
    display:flex;
    align-items:center;
    gap:6px;
    background:transparent;
    color:#fff;
    border:1.5px solid rgba(255,255,255,0.55);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px 18px;
    border-radius:9px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
    min-height:54px;
  }
  .btn-reorder:hover{ background:rgba(255,255,255,0.1); }
  .btn-reorder.active{
    background:var(--brass);
    border-color:var(--brass);
    color:#fff;
  }

  .reorder-controls{
    display:flex;
    gap:8px;
    margin-bottom:4px;
  }
  .reorder-btn{
    flex:1;
    background:var(--pine-tint);
    border:1px solid var(--line-strong);
    color:var(--pine-dark);
    font-size:16px;
    font-weight:700;
    padding:10px 0;
    border-radius:7px;
    cursor:pointer;
    min-height:44px;
  }
  .reorder-btn:hover{ background:var(--brass-tint); }
  .reorder-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .block-maker.reorder-mode,
  .card.reorder-mode{
    cursor:default;
  }
  .block-maker.reorder-mode:hover,
  .card.reorder-mode:hover{
    border-color:var(--line);
    box-shadow:none;
    transform:none;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding:32px 36px 70px;
    max-width:1200px;
    width:100%;
    margin:0 auto;
  }

  .back-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
  }
  .back-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--line-strong);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    min-height:48px;
  }
  .back-btn:hover{ background:var(--surface-alt); }

  .main-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .main-top h2{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:24px;
    font-weight:700;
    margin:0;
  }
  .main-top .result-n{
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ---------- Maker blocks (level 1) ---------- */
  .grid-makers{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:18px;
  }
  .block-maker{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 22px;
    cursor:pointer;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    transition:border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    min-height:150px;
    justify-content:center;
  }
  .block-maker:hover{ border-color:var(--pine); box-shadow:0 3px 14px rgba(35,56,51,0.12); }
  .block-maker:active{ transform:scale(0.97); }
  .block-maker .icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--pine-tint);
    color:var(--pine-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:20px;
  }
  .block-maker .name{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    line-height:1.4;
    text-wrap:balance;
    max-width:100%;
  }
  .block-maker .n{
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---------- Catalog blocks (level 2) ---------- */
  .grid-catalogs{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:16px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 18px;
    cursor:pointer;
    transition:border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:140px;
  }
  .card:hover{ border-color:var(--pine); box-shadow:0 2px 10px rgba(35,56,51,0.1); }
  .card:active{ transform:scale(0.98); }
  .card .name{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    line-height:1.4;
    text-wrap:balance;
    max-width:100%;
  }
  .card .memo{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.55;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    flex:1;
  }
  .card .card-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:4px;
  }
  .card .open-hint{
    font-size:13px;
    color:var(--pine);
    font-weight:700;
  }
  .edit-btn{
    background:transparent;
    border:none;
    color:var(--ink-faint);
    font-size:13px;
    padding:8px 10px;
    border-radius:6px;
    cursor:pointer;
    min-height:36px;
  }
  .edit-btn:hover{ background:var(--surface-alt); color:var(--ink); }

  .empty{
    text-align:center;
    padding:90px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
  }
  .empty button{
    margin-top:20px;
    background:var(--pine);
    color:#fff;
    border:none;
    padding:15px 26px;
    border-radius:8px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    min-height:52px;
  }

  .loading{
    padding:90px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(30,28,24,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--surface);
    width:100%;
    max-width:500px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:12px;
    padding:28px 28px 24px;
  }
  .modal h3{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:20px;
    margin:0 0 20px;
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .field input, .field textarea{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    font-family:'Noto Sans JP', sans-serif;
    font-size:16px;
    color:var(--ink);
    background:var(--surface);
    min-height:50px;
  }
  .field input:focus, .field textarea:focus{
    outline:2px solid var(--pine);
    outline-offset:-1px;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-error{
    font-size:12.5px;
    color:var(--danger);
    margin-top:6px;
  }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:22px;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--ink);
    padding:14px 20px;
    border-radius:8px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    min-height:50px;
  }
  .btn-primary{
    background:var(--pine);
    border:none;
    color:#fff;
    padding:14px 24px;
    border-radius:8px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    min-height:50px;
  }
  .btn-primary:hover{ background:var(--pine-dark); }

  .btn-danger{
    background:transparent;
    border:1px solid var(--danger);
    color:var(--danger);
    padding:14px 20px;
    border-radius:8px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    min-height:50px;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }

  /* ---------- Tablet (portrait) ---------- */
  @media (max-width: 900px){
    .main{ padding:26px 22px 60px; }
    .grid-makers{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); }
    .grid-catalogs{ grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); }
  }

  /* ---------- Smartphone ---------- */
  @media (max-width: 640px){
    body{ overflow:auto; }
    .header{
      padding:14px 16px;
      flex-wrap:wrap;
      gap:12px;
    }
    .header .brand .mark{ font-size:20px; }
    .header-actions{
      width:100%;
      flex-direction:column;
      gap:10px;
    }
    .btn-add{
      font-size:14.5px;
      padding:12px 18px;
      min-height:46px;
      width:100%;
      justify-content:center;
    }
    .btn-reorder{
      font-size:14.5px;
      padding:12px 18px;
      min-height:46px;
      width:100%;
      justify-content:center;
    }
    .main{ padding:18px 16px 50px; }
    .back-row{ margin-bottom:16px; }
    .back-btn{
      font-size:14px;
      padding:10px 16px;
      min-height:44px;
    }
    .main-top{ margin-bottom:16px; }
    .main-top h2{ font-size:19px; }
    .main-top .result-n{ font-size:13px; }

    .grid-makers{
      grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
      gap:12px;
    }
    .block-maker{
      padding:20px 14px;
      min-height:120px;
      gap:8px;
    }
    .block-maker .icon{ width:44px; height:44px; font-size:17px; }
    .block-maker .name{ font-size:18px; }
    .block-maker .n{ font-size:12px; }

    .grid-catalogs{
      grid-template-columns:1fr;
      gap:12px;
    }
    .card{ padding:16px 16px 14px; min-height:auto; }
    .card .name{ font-size:19px; }

    .modal{
      padding:22px 18px 18px;
      border-radius:10px;
      max-height:90vh;
    }
    .modal h3{ font-size:18px; margin-bottom:16px; }
    .field input, .field textarea{
      font-size:16px; /* iOSの自動ズームを防ぐ */
      padding:11px 12px;
      min-height:46px;
    }
    .modal-actions{
      flex-direction:column-reverse;
      gap:10px;
    }
    .modal-actions button{ width:100%; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="header">
    <div class="brand">
      <div class="mark">カタログ帳</div>
    </div>
    <div class="header-actions">
      <button class="btn-reorder" id="btnReorder">⇅ 並び替え</button>
      <button class="btn-add" id="btnAddHeader">＋ カタログを登録</button>
    </div>
  </div>

  <div class="main">
    <div class="back-row" id="backRow" style="display:none;">
      <button class="back-btn" id="backBtn">← メーカー一覧に戻る</button>
    </div>
    <div class="main-top">
      <h2 id="mainTitle"></h2>
      <span class="result-n" id="resultN"></span>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
// ここに、Google Apps Scriptをデプロイして発行されたURLを貼り付けてください
// 例: "https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXX/exec"
const API_URL = "https://script.google.com/macros/s/AKfycby3pYilv6XP0lwOXyx38kRi6bKJWBSWoP-2c2X4VpaAR_R9x9lGHnFTIXNI81xTAQ2I-Q/exec";

let entries = [];
let loaded = false;
let loadFailed = false;
let reorderMode = false;
let state = { view: 'makers', maker: null }; // view: 'makers' | 'catalogs'

const CACHE_STORAGE_KEY = 'catalogAppCache_v1';   // 共有データ(カタログ内容)のキャッシュ
const ORDER_STORAGE_KEY = 'catalogAppOrder_v1';   // この端末だけの並び順

function loadLocalOrder(){
  try{
    const raw = localStorage.getItem(ORDER_STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return {
      makerOrder: (parsed && Array.isArray(parsed.makerOrder)) ? parsed.makerOrder : [],
      entryOrder: (parsed && parsed.entryOrder && typeof parsed.entryOrder === 'object') ? parsed.entryOrder : {}
    };
  }catch(e){
    return { makerOrder: [], entryOrder: {} };
  }
}

function saveLocalOrder(){
  try{
    localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(localOrder));
  }catch(e){
    // 保存に失敗しても致命的ではないので無視する
  }
}

let localOrder = loadLocalOrder();

const el = (sel) => document.querySelector(sel);
const contentEl = el('#content');
const modalRoot = el('#modalRoot');
const mainTitleEl = el('#mainTitle');
const resultNEl = el('#resultN');
const backRowEl = el('#backRow');
const backBtnEl = el('#backBtn');
const btnAddHeaderEl = el('#btnAddHeader');
const btnReorderEl = el('#btnReorder');

function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeUrl(u){
  u = (u || '').trim();
  if(!u) return u;
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

// ブロック内の見出し文字を「入る限り大きく・できれば1行・両端に余白」で自動調整する
const NAME_MAX_SIZE = 22;   // 基準の最大サイズ(px)
const NAME_MIN_SIZE = 13;   // これ以上は縮めない下限(px)
const NAME_SIDE_GAP = 14;   // 文字と枠の両端に残す余白(px、片側あたり)
const LATIN_HEIGHT_BOOST = 1.18; // 漢字と同じpxでもアルファベットは小さく見えるための補正倍率
let _fitCanvasCtx = null;

function containsCJK(text){
  return /[\u3000-\u303F\u3040-\u30FF\u3400-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/.test(text);
}

function measureTextWidth(text, size){
  if(!_fitCanvasCtx){
    _fitCanvasCtx = document.createElement('canvas').getContext('2d');
  }
  _fitCanvasCtx.font = `700 ${size}px 'Zen Kaku Gothic New', sans-serif`;
  return _fitCanvasCtx.measureText(text).width;
}

function fitNameElements(){
  document.querySelectorAll('.block-maker .name, .card .name').forEach(elm => {
    const text = elm.textContent;
    const available = elm.clientWidth - NAME_SIDE_GAP * 2;
    if(available <= 0 || !text) return;

    // 漢字・かなを含まない(英数字だけの)名前は、見た目の高さを漢字に揃えるため少し大きめに扱う
    const boost = containsCJK(text) ? 1 : LATIN_HEIGHT_BOOST;
    const maxSize = NAME_MAX_SIZE * boost;
    const minSize = NAME_MIN_SIZE * boost;

    let chosen = minSize;
    for(let size = maxSize; size >= minSize; size -= 0.5){
      if(measureTextWidth(text, size) <= available){
        chosen = size;
        break;
      }
    }

    const fitsOnOneLine = measureTextWidth(text, chosen) <= available;
    elm.style.fontSize = chosen + 'px';
    elm.style.paddingLeft = NAME_SIDE_GAP + 'px';
    elm.style.paddingRight = NAME_SIDE_GAP + 'px';
    elm.style.boxSizing = 'border-box';
    if(fitsOnOneLine){
      elm.style.whiteSpace = 'nowrap';
      elm.style.overflow = 'hidden';
      elm.style.textOverflow = 'ellipsis';
    } else {
      // 極端に長い名前だけ、最小サイズのまま折り返しを許可する
      elm.style.whiteSpace = 'normal';
      elm.style.overflow = 'visible';
      elm.style.textOverflow = 'clip';
    }
  });
}

let _fitResizeTimer = null;
function scheduleFitNames(){
  clearTimeout(_fitResizeTimer);
  _fitResizeTimer = setTimeout(fitNameElements, 120);
}
window.addEventListener('resize', scheduleFitNames);

function isApiConfigured(){
  return API_URL && API_URL.startsWith('http');
}

async function apiCall(params){
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if(!res.ok) throw new Error('network error');
  return await res.json();
}

function loadCacheFromLocalStorage(){
  try{
    const raw = localStorage.getItem(CACHE_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.entries)) return null;
    return parsed;
  }catch(e){
    return null;
  }
}

function persistCache(){
  try{
    localStorage.setItem(CACHE_STORAGE_KEY, JSON.stringify({ entries, savedAt: Date.now() }));
  }catch(e){
    // 保存容量オーバーなどは無視して問題ない(次回また保存を試みる)
  }
}

async function loadEntries(){
  if(!isApiConfigured()){
    loadFailed = true;
    loaded = true;
    render();
    return;
  }

  // 前回表示していたデータがあれば、通信を待たずに先に表示して体感速度を上げる
  const cached = loadCacheFromLocalStorage();
  if(cached){
    entries = cached.entries;
    loaded = true;
    loadFailed = false;
    render();
  }

  try{
    const data = await apiCall({ action: 'list' });
    entries = data.entries || [];
    loadFailed = false;
    persistCache();
  }catch(e){
    if(!cached){
      entries = [];
      loadFailed = true;
    }
    // キャッシュがある場合は、通信に失敗してもキャッシュの内容をそのまま表示し続ける
  }
  loaded = true;
  render();
}

async function addEntryRemote(maker, name, url, memo){
  const data = await apiCall({ action: 'add', maker, name, url, memo });
  entries = data.entries || [];
  persistCache();
}

async function updateEntryRemote(id, maker, name, url, memo){
  const data = await apiCall({ action: 'update', id, maker, name, url, memo });
  entries = data.entries || [];
  persistCache();
}

async function deleteEntryRemote(id){
  const data = await apiCall({ action: 'delete', id });
  entries = data.entries || [];
  persistCache();
}

function getOrderedMakers(){
  const counts = new Map();
  entries.forEach(e => counts.set(e.maker, (counts.get(e.maker)||0) + 1));
  const allNames = [...counts.keys()];
  const known = (localOrder.makerOrder || []).filter(n => counts.has(n));
  const unknown = allNames.filter(n => !known.includes(n)).sort((a,b) => a.localeCompare(b, 'ja'));
  const orderedNames = [...known, ...unknown];

  // 新しく増えたメーカーなどがあれば、この端末の並び順にも反映しておく
  if(JSON.stringify(orderedNames) !== JSON.stringify(localOrder.makerOrder)){
    localOrder.makerOrder = orderedNames;
    saveLocalOrder();
  }
  return orderedNames.map(n => [n, counts.get(n)]);
}

function getEntriesForMaker(maker){
  const list = entries.filter(e => e.maker === maker);
  const order = localOrder.entryOrder[maker];
  if(!order || !order.length) return list;

  const idToEntry = new Map(list.map(e => [e.id, e]));
  const known = order.map(id => idToEntry.get(id)).filter(Boolean);
  const knownIds = new Set(known.map(e => e.id));
  const unknown = list.filter(e => !knownIds.has(e.id)); // 他の端末で新しく追加された分は末尾に入る
  const merged = [...known, ...unknown];

  const mergedIds = merged.map(e => e.id);
  if(JSON.stringify(mergedIds) !== JSON.stringify(order)){
    localOrder.entryOrder[maker] = mergedIds;
    saveLocalOrder();
  }
  return merged;
}

function moveMaker(name, direction){
  const names = getOrderedMakers().map(([n]) => n);
  const idx = names.indexOf(name);
  const newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= names.length) return;
  [names[idx], names[newIdx]] = [names[newIdx], names[idx]];
  localOrder.makerOrder = names;
  saveLocalOrder();
  renderMain();
}

function moveEntry(id, direction){
  const list = getEntriesForMaker(state.maker);
  const idx = list.findIndex(x => x.id === id);
  const newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= list.length) return;
  const ids = list.map(e => e.id);
  [ids[idx], ids[newIdx]] = [ids[newIdx], ids[idx]];
  localOrder.entryOrder[state.maker] = ids;
  saveLocalOrder();
  renderMain();
}

function goToMakers(){
  state.view = 'makers';
  state.maker = null;
  reorderMode = false;
  updateReorderButton();
  render();
}

function goToMaker(maker){
  state.view = 'catalogs';
  state.maker = maker;
  reorderMode = false;
  updateReorderButton();
  render();
}

backBtnEl.addEventListener('click', goToMakers);

function updateReorderButton(){
  btnReorderEl.textContent = reorderMode ? '完了' : '⇅ 並び替え';
  btnReorderEl.classList.toggle('active', reorderMode);
  btnAddHeaderEl.disabled = reorderMode;
}

btnReorderEl.addEventListener('click', () => {
  reorderMode = !reorderMode;
  updateReorderButton();
  renderMain();
});

function render(){
  if(state.view === 'catalogs'){
    backRowEl.style.display = '';
  } else {
    backRowEl.style.display = 'none';
  }
  renderMain();
}

function renderMain(){
  if(!loaded){
    mainTitleEl.textContent = '';
    resultNEl.textContent = '';
    contentEl.innerHTML = `<div class="loading">読み込み中です…</div>`;
    return;
  }

  if(loadFailed){
    mainTitleEl.textContent = '';
    resultNEl.textContent = '';
    contentEl.innerHTML = `
      <div class="empty">
        <div class="big">データを読み込めませんでした</div>
        <div>スプレッドシートと連携するAPIのURLが未設定か、接続に失敗しています。<br>アプリのコード内にある API_URL に、Apps Scriptで発行したURLを貼り付けてください。</div>
      </div>`;
    return;
  }

  if(entries.length === 0){
    mainTitleEl.textContent = '';
    resultNEl.textContent = '';
    contentEl.innerHTML = `
      <div class="empty">
        <div class="big">まだカタログが登録されていません</div>
        <div>メーカーのカタログURLを登録すると、ここに表示されます</div>
        <button id="emptyAddBtn">＋ 最初のカタログを登録する</button>
      </div>`;
    el('#emptyAddBtn').addEventListener('click', () => openFormModal());
    return;
  }

  if(state.view === 'makers'){
    renderMakersView();
  } else {
    renderCatalogsView();
  }
}

function renderMakersView(){
  const makers = getOrderedMakers();
  mainTitleEl.textContent = '';
  resultNEl.textContent = reorderMode ? '並び替え中(この端末のみ保存)' : `${makers.length} 社`;

  contentEl.innerHTML = `<div class="grid-makers">${makers.map(([name, n], idx) => `
    <div class="block-maker ${reorderMode ? 'reorder-mode' : ''}" data-maker="${escapeHtml(name)}">
      ${reorderMode ? `
        <div class="reorder-controls">
          <button class="reorder-btn" data-move="prev" ${idx === 0 ? 'disabled' : ''} aria-label="前へ">◀ 前</button>
          <button class="reorder-btn" data-move="next" ${idx === makers.length - 1 ? 'disabled' : ''} aria-label="次へ">次 ▶</button>
        </div>
      ` : ''}
      <div class="icon">${escapeHtml(name.slice(0,1))}</div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="n">${n} 件のカタログ</div>
    </div>
  `).join('')}</div>`;

  fitNameElements();

  if(reorderMode){
    contentEl.querySelectorAll('.block-maker').forEach(node => {
      const name = node.dataset.maker;
      const prevBtn = node.querySelector('[data-move="prev"]');
      const nextBtn = node.querySelector('[data-move="next"]');
      if(prevBtn) prevBtn.addEventListener('click', (ev) => { ev.stopPropagation(); moveMaker(name, -1); });
      if(nextBtn) nextBtn.addEventListener('click', (ev) => { ev.stopPropagation(); moveMaker(name, 1); });
    });
  } else {
    contentEl.querySelectorAll('.block-maker').forEach(node => {
      node.addEventListener('click', () => goToMaker(node.dataset.maker));
    });
  }
}

function renderCatalogsView(){
  const list = getEntriesForMaker(state.maker);
  mainTitleEl.textContent = state.maker;
  resultNEl.textContent = reorderMode ? '並び替え中(この端末のみ保存)' : `${list.length} 件`;

  if(list.length === 0){
    contentEl.innerHTML = `
      <div class="empty">
        <div class="big">このメーカーのカタログはまだありません</div>
        <button id="emptyAddBtn2">＋ カタログを登録する</button>
      </div>`;
    el('#emptyAddBtn2').addEventListener('click', () => openFormModal(null, state.maker));
    return;
  }

  contentEl.innerHTML = `<div class="grid-catalogs">${list.map((e, idx) => cardHtml(e, idx, list.length)).join('')}</div>`;
  fitNameElements();

  if(reorderMode){
    list.forEach(e => {
      const node = el(`[data-card="${e.id}"]`);
      const prevBtn = node.querySelector('[data-move="prev"]');
      const nextBtn = node.querySelector('[data-move="next"]');
      if(prevBtn) prevBtn.addEventListener('click', (ev) => { ev.stopPropagation(); moveEntry(e.id, -1); });
      if(nextBtn) nextBtn.addEventListener('click', (ev) => { ev.stopPropagation(); moveEntry(e.id, 1); });
    });
  } else {
    list.forEach(e => {
      const cardNode = el(`[data-card="${e.id}"]`);
      cardNode.addEventListener('click', (ev) => {
        if(ev.target.closest('.edit-btn')) return;
        window.open(e.url, '_blank', 'noopener');
      });
      el(`[data-edit="${e.id}"]`).addEventListener('click', (ev) => {
        ev.stopPropagation();
        openFormModal(e);
      });
    });
  }
}

function cardHtml(e, idx, total){
  if(reorderMode){
    return `
      <div class="card reorder-mode" data-card="${e.id}">
        <div class="reorder-controls">
          <button class="reorder-btn" data-move="prev" ${idx === 0 ? 'disabled' : ''} aria-label="前へ">◀ 前</button>
          <button class="reorder-btn" data-move="next" ${idx === total - 1 ? 'disabled' : ''} aria-label="次へ">次 ▶</button>
        </div>
        <div class="name">${escapeHtml(e.name)}</div>
      </div>`;
  }
  return `
    <div class="card" data-card="${e.id}">
      <div class="name">${escapeHtml(e.name)}</div>
      ${e.memo ? `<div class="memo">${escapeHtml(e.memo)}</div>` : '<div class="memo"></div>'}
      <div class="card-foot">
        <span class="open-hint">タップして開く</span>
        <button class="edit-btn" data-edit="${e.id}">編集</button>
      </div>
    </div>`;
}

/* ---------- Form modal (add / edit) ---------- */
function openFormModal(existing, presetMaker){
  const isEdit = !!existing;
  const makerValue = isEdit ? existing.maker : (presetMaker || '');

  modalRoot.innerHTML = `
    <div class="overlay" id="formOverlay">
      <div class="modal">
        <h3>${isEdit ? 'カタログを編集' : 'カタログを登録'}</h3>
        <form id="catalogForm">
          <div class="field">
            <label for="f_maker">メーカー名</label>
            <input type="text" id="f_maker" placeholder="例: LIXIL" value="${escapeHtml(makerValue)}" required>
          </div>
          <div class="field">
            <label for="f_name">商品名・カタログ名</label>
            <input type="text" id="f_name" placeholder="例: フェンスAB 総合カタログ" value="${isEdit ? escapeHtml(existing.name) : ''}" required>
          </div>
          <div class="field">
            <label for="f_url">カタログのURL</label>
            <input type="text" id="f_url" placeholder="https://" value="${isEdit ? escapeHtml(existing.url) : ''}" required>
            <div class="field-error" id="urlError" style="display:none;">URLを入力してください</div>
          </div>
          <div class="field">
            <label for="f_memo">メモ(任意)</label>
            <textarea id="f_memo" placeholder="現場での案内メモなど">${isEdit ? escapeHtml(existing.memo||'') : ''}</textarea>
          </div>
          <div class="field-error" id="submitError" style="display:none;"></div>
          <div class="modal-actions">
            ${isEdit ? `<button type="button" class="btn-danger" id="deleteBtn">削除</button>` : ''}
            <button type="button" class="btn-secondary" id="cancelForm">キャンセル</button>
            <button type="submit" class="btn-primary" id="submitBtn">${isEdit ? '更新する' : '登録する'}</button>
          </div>
        </form>
      </div>
    </div>`;

  el('#cancelForm').addEventListener('click', () => closeModal());

  if(isEdit){
    el('#deleteBtn').addEventListener('click', () => confirmDelete(existing));
  }

  el('#catalogForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const maker = el('#f_maker').value.trim();
    const name = el('#f_name').value.trim();
    const urlRaw = el('#f_url').value.trim();
    const memo = el('#f_memo').value.trim();

    if(!urlRaw){
      el('#urlError').style.display = '';
      return;
    }
    const url = normalizeUrl(urlRaw);
    const submitBtn = el('#submitBtn');
    const errorBox = el('#submitError');
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = '保存中…';

    try{
      if(isEdit){
        await updateEntryRemote(existing.id, maker, name, url, memo);
      } else {
        await addEntryRemote(maker, name, url, memo);
      }
      state.maker = maker;
      state.view = 'catalogs';
      loadFailed = false;
      render();
      closeModal();
    }catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = isEdit ? '更新する' : '登録する';
      errorBox.textContent = '保存に失敗しました。通信状況を確認して、もう一度お試しください。';
      errorBox.style.display = '';
    }
  });
}

function confirmDelete(e){
  modalRoot.innerHTML = `
    <div class="overlay" id="delOverlay">
      <div class="modal" style="max-width:400px;">
        <h3>削除しますか?</h3>
        <p style="font-size:14.5px; color:var(--ink-soft); line-height:1.7;">
          「${escapeHtml(e.maker)} / ${escapeHtml(e.name)}」を削除します。この操作は元に戻せません。
        </p>
        <div class="field-error" id="deleteError" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancelDel">キャンセル</button>
          <button class="btn-danger" id="confirmDel">削除する</button>
        </div>
      </div>
    </div>`;
  el('#cancelDel').addEventListener('click', () => openFormModal(e));
  el('#confirmDel').addEventListener('click', async () => {
    const confirmBtn = el('#confirmDel');
    const errorBox = el('#deleteError');
    confirmBtn.disabled = true;
    confirmBtn.textContent = '削除中…';
    try{
      await deleteEntryRemote(e.id);
      const stillHasMaker = entries.some(x => x.maker === e.maker);
      if(!stillHasMaker) state.view = 'makers', state.maker = null;
      render();
      closeModal();
    }catch(err){
      confirmBtn.disabled = false;
      confirmBtn.textContent = '削除する';
      errorBox.textContent = '削除に失敗しました。通信状況を確認して、もう一度お試しください。';
      errorBox.style.display = '';
    }
  });
}

function closeModal(){ modalRoot.innerHTML = ''; }

/* ---------- Global listeners ---------- */
el('#btnAddHeader').addEventListener('click', () => openFormModal(null, state.view === 'catalogs' ? state.maker : ''));
document.addEventListener('keydown', (ev) => {
  if(ev.key === 'Escape') closeModal();
});

loadEntries();
</script>
</body>
</html>
